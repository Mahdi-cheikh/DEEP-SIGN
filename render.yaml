# Render Blueprint for DEEP-SIGN
# Push this repo to GitHub, then in Render: "New +" → "Blueprint" → pick this repo.
#
# NOTE: Free-tier web services on Render don't support persistent disks, so the
# SQLite database lives in the container's ephemeral filesystem and is wiped on
# every redeploy or restart. That's fine for a demo. For real persistence, either:
#   (a) upgrade `deep-sign-api` to the Starter plan and re-add a `disk:` block, or
#   (b) attach a Render PostgreSQL database and set DATABASE_URL accordingly
#       (e.g. postgresql+psycopg://USER:PASS@HOST/DBNAME).

services:
  # --- Backend: FastAPI + MediaPipe ---
  - type: web
    name: deep-sign-api
    env: docker
    plan: free                     # upgrade to "starter" for always-on + a persistent disk
    region: oregon                 # change to your preferred region
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong random value
      - key: DATABASE_URL
        value: sqlite:///./deepsign.db   # ephemeral on free plan — see note above
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: MIN_CONFIDENCE
        value: "0.55"
      - key: CORS_ORIGINS
        # Replace with your real frontend URL after the first deploy
        value: https://deep-sign-web.onrender.com

  # --- Frontend: React static site served by nginx ---
  - type: web
    name: deep-sign-web
    env: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      # The backend URL the frontend should talk to. Read by nginx.conf.template at boot.
      - key: BACKEND_URL
        value: https://deep-sign-api.onrender.com
