services:
  backend:
    build: ./backend
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-long-random-string}
      - DATABASE_URL=sqlite:////data/deepsign.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  backend_data:
